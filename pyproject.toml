[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pampapilot"
version = "0.1.0"
description = "AI-powered music production agent for REAPER and other DAWs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2,<3",
]

[project.scripts]
pampapilot-mcp = "pampapilot.mcp_server:main"
pampapilot-web = "pampapilot.web_server:main"

[project.optional-dependencies]
analysis = [
    "numpy>=2,<3",
    "soundfile>=0.13,<1",
    "pyloudnorm>=0.1.1,<1",
    "mido>=1.3,<2",
    "librosa>=0.11,<1",
    "pyyaml>=6,<7",
    "scipy>=1.15,<2",
]
lyrics-alignment = [
    "faster-whisper>=1.2,<2",
    "truststore>=0.10,<1",
]
web = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pampapilot = ["web/*.html", "web/*.css", "web/*.js"]

[tool.uv]
system-certs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
