[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pampapilot"
version = "0.1.0"
description = "AI-powered music production agent for REAPER and other DAWs"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
]

[project.scripts]
pampapilot-mcp = "pampapilot.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
